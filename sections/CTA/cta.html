<!-- CTA Section -->
<section class="cta-section py-24 bg-dark relative overflow-hidden">

  <!-- Background decorative circles -->
  <div class="cta-circle-1 absolute -top-20 -left-20 w-80 h-80 rounded-full opacity-10"></div>
  <div class="cta-circle-2 absolute -bottom-20 -right-20 w-96 h-96 rounded-full opacity-10"></div>
  <div class="cta-circle-3 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full opacity-5"></div>

  <div class="max-w-4xl mx-auto px-6 text-center relative z-10">
    <!-- Small badge -->
    <div class="inline-flex items-center gap-2 bg-white bg-opacity-10 rounded-full px-4 py-2 mb-8">
      <div class="w-2 h-2 bg-accent rounded-full animate-pulse"></div>
      <span class="text-white text-sm font-medium">No credit card required</span>
    </div>

    <h2 class="text-3xl lg:text-5xl font-bold text-white mb-6 leading-tight">
      Start your 14-day free<br>trial <span class="text-accent">today</span>
    </h2>

    <p class="text-gray-300 text-lg mb-10 max-w-2xl mx-auto leading-relaxed">
      Join over 10,000 teams already using Whitepace to collaborate smarter, move faster, and build better products.
    </p>

    <!-- Email signup form -->
    <div class="cta-form flex flex-col sm:flex-row gap-3 max-w-xl mx-auto mb-6">
      <input
        type="email"
        placeholder="Enter your work email"
        class="flex-1 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl px-5 py-4 text-white placeholder-gray-400 outline-none focus:border-primary focus:bg-opacity-20 transition-all text-sm"
      />
      <button class="bg-primary text-white font-semibold px-8 py-4 rounded-xl hover:bg-blue-400 transition-all duration-200 whitespace-nowrap hover:shadow-lg hover:shadow-blue-500/30">
        Get Started Free →
      </button>
    </div>

    <p class="text-gray-400 text-sm">
      Free 14-day trial · No credit card · Cancel anytime
    </p>

    <!-- App Store badges -->
    <div class="flex items-center justify-center gap-4 mt-10">
      <a href="#" class="cta-badge flex items-center gap-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl px-5 py-3 hover:bg-opacity-20 transition-all">
        <svg width="20" height="24" viewBox="0 0 20 24" fill="white">
          <path d="M16.5 12.5C16.5 10.5 17.5 8.8 19 7.7C18 6.4 16.4 5.5 14.8 5.5C13 5.5 11.5 6.5 10.5 6.5C9.5 6.5 8 5.5 6.5 5.5C4 5.5 1.5 7.3 1.5 11C1.5 14.5 3.5 20.5 6 20.5C7.3 20.5 8 19.5 9.5 19.5C11 19.5 11.5 20.5 13 20.5C15.5 20.5 17.5 14.5 18.5 12C17.5 11.5 16.5 12 16.5 12.5ZM13 4C13.5 3.3 14 2.3 14 1.3C12.5 1.5 11 2.5 10.5 3.5C10 4.5 9.5 5.5 9.5 6.5C11 6.5 12 5 13 4Z"/>
        </svg>
        <div class="text-left">
          <div class="text-white text-xs opacity-70">Download on the</div>
          <div class="text-white font-semibold text-sm">App Store</div>
        </div>
      </a>

      <a href="#" class="cta-badge flex items-center gap-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl px-5 py-3 hover:bg-opacity-20 transition-all">
        <svg width="20" height="22" viewBox="0 0 20 22" fill="none">
          <path d="M1 1L11 11L1 21" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M1 1L18 10L11 11" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M1 21L18 12L11 11" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="text-left">
          <div class="text-white text-xs opacity-70">Get it on</div>
          <div class="text-white font-semibold text-sm">Google Play</div>
        </div>
      </a>
    </div>

  </div>
</section>
